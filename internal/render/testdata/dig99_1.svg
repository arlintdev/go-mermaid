    <rect x="1038.9" y="835" width="130.72" height="52" rx="2" fill="#e8e8e8" fill-opacity="0.85"/>
    <text fill="#333333" text-anchor="middle"><tspan x="1104.26" y="854.6">no actor in ctx, or</tspan><tspan x="1104.26" y="878.6">store.Unscoped</tspan></text>
    <rect x="258.48" y="0" width="152" height="48" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="334.48" y="29.6">Request</tspan></text>
    <rect x="255.35" y="98" width="158.26" height="72" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="334.48" y="127.6">asNobody:</tspan><tspan x="334.48" y="151.6">store.Nobody(ctx)</tspan></text>
    <rect x="159.42" y="220" width="210.74" height="120" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="264.79" y="249.6">authenticator.middleware</tspan><tspan x="264.79" y="273.6">or the MCP</tspan><tspan x="264.79" y="297.6">endpoint:</tspan><tspan x="264.79" y="321.6">ScopeFor</tspan></text>
    <rect x="178.99" y="418" width="171.6" height="72" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="264.79" y="447.6">store.AsPerson(ctx,</tspan><tspan x="264.79" y="471.6">user, scope)</tspan></text>
    <rect x="438.16" y="220" width="152" height="120" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="514.16" y="249.6">A bot is woken:</tspan><tspan x="514.16" y="273.6">named, handed</tspan><tspan x="514.16" y="297.6">an issue, a</tspan><tspan x="514.16" y="321.6">watch, a task</tspan></text>
    <rect x="438.16" y="418" width="152" height="144" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="514.16" y="447.6">store.AsBot(ctx,</tspan><tspan x="514.16" y="471.6">bot), or</tspan><tspan x="514.16" y="495.6">AsBotFor(ctx,</tspan><tspan x="514.16" y="519.6">bot, person) for</tspan><tspan x="514.16" y="543.6">a task</tspan></text>
    <rect x="665.08" y="220" width="152" height="96" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="741.08" y="249.6">A forge delivery</tspan><tspan x="741.08" y="273.6">whose signature</tspan><tspan x="741.08" y="297.6">holds</tspan></text>
    <rect x="640.16" y="418" width="201.84" height="72" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="741.08" y="447.6">store.AsConnection(ctx,</tspan><tspan x="741.08" y="471.6">connection)</tspan></text>
    <rect x="920.02" y="220" width="152" height="96" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="996.02" y="249.6">A SCIM request</tspan><tspan x="996.02" y="273.6">whose token</tspan><tspan x="996.02" y="297.6">holds</tspan></text>
    <rect x="892" y="418" width="208.05" height="72" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="996.02" y="447.6">store.AsProvisioning(ctx,</tspan><tspan x="996.02" y="471.6">token)</tspan></text>
    <rect x="505.79" y="627" width="156.51" height="168" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="584.04" y="656.6">scopedConn.hold</tspan><tspan x="584.04" y="680.6">before each</tspan><tspan x="584.04" y="704.6">statement, with</tspan><tspan x="584.04" y="728.6">digin.proof, the</tspan><tspan x="584.04" y="752.6">store&#39;s HMAC of</tspan><tspan x="584.04" y="776.6">whose it is</tspan></text>
    <rect x="0" y="912" width="152" height="144" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="76" y="941.6">SET role</tspan><tspan x="76" y="965.6">digin_app,</tspan><tspan x="76" y="989.6">digin.actor =</tspan><tspan x="76" y="1013.6">user id,</tspan><tspan x="76" y="1037.6">digin.reach</tspan></text>
    <rect x="202" y="912" width="152" height="192" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="278" y="941.6">SET role</tspan><tspan x="278" y="965.6">digin_app,</tspan><tspan x="278" y="989.6">digin.actor =</tspan><tspan x="278" y="1013.6">bot&#39;s user id,</tspan><tspan x="278" y="1037.6">digin.reach =</tspan><tspan x="278" y="1061.6">bot:B or</tspan><tspan x="278" y="1085.6">bot:B@U</tspan></text>
    <rect x="404" y="912" width="152" height="120" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="480" y="941.6">SET role</tspan><tspan x="480" y="965.6">digin_app,</tspan><tspan x="480" y="989.6">digin.actor =</tspan><tspan x="480" y="1013.6">nobody</tspan></text>
    <rect x="606" y="912" width="152" height="168" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="682" y="941.6">SET role</tspan><tspan x="682" y="965.6">digin_app,</tspan><tspan x="682" y="989.6">digin.actor =</tspan><tspan x="682" y="1013.6">forge,</tspan><tspan x="682" y="1037.6">digin.reach =</tspan><tspan x="682" y="1061.6">connection:C</tspan></text>
    <rect x="808" y="912" width="152" height="168" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="884" y="941.6">SET role</tspan><tspan x="884" y="965.6">digin_app,</tspan><tspan x="884" y="989.6">digin.actor =</tspan><tspan x="884" y="1013.6">provisioning,</tspan><tspan x="884" y="1037.6">digin.reach =</tspan><tspan x="884" y="1061.6">scim:T</tspan></text>
    <rect x="1010" y="912" width="188.53" height="336" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="1104.26" y="941.6">The server&#39;s own</tspan><tspan x="1104.26" y="965.6">work: on its own login</tspan><tspan x="1104.26" y="989.6">as digin_system; on</tspan><tspan x="1104.26" y="1013.6">one login of the</tspan><tspan x="1104.26" y="1037.6">server&#39;s, the same; as</tspan><tspan x="1104.26" y="1061.6">the login itself where</tspan><tspan x="1104.26" y="1085.6">that is a superuser or</tspan><tspan x="1104.26" y="1109.6">the tables&#39; owner;</tspan><tspan x="1104.26" y="1133.6">inside somebody&#39;s</tspan><tspan x="1104.26" y="1157.6">transaction, digin_app</tspan><tspan x="1104.26" y="1181.6">vouched for as</tspan><tspan x="1104.26" y="1205.6">system. digin.actor =</tspan><tspan x="1104.26" y="1229.6">system</tspan></text>
    <rect x="0" y="1298" width="152" height="192" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="76" y="1327.6">Policies:</tspan><tspan x="76" y="1351.6">member</tspan><tspan x="76" y="1375.6">workspaces,</tspan><tspan x="76" y="1399.6">their projects,</tspan><tspan x="76" y="1423.6">what is under</tspan><tspan x="76" y="1447.6">them, their own</tspan><tspan x="76" y="1471.6">conversations</tspan></text>
    <rect x="202" y="1298" width="152" height="192" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="278" y="1327.6">Policies:</tspan><tspan x="278" y="1351.6">digin_bot_reach,</tspan><tspan x="278" y="1375.6">its workspace,</tspan><tspan x="278" y="1399.6">granted projects,</tspan><tspan x="278" y="1423.6">its channels; no</tspan><tspan x="278" y="1447.6">writes where</tspan><tspan x="278" y="1471.6">read-only</tspan></text>
    <rect x="404" y="1298" width="152" height="72" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="480" y="1327.6">Policies: no row</tspan><tspan x="480" y="1351.6">of any table</tspan></text>
    <rect x="606" y="1298" width="152" height="120" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="682" y="1327.6">Policies: the</tspan><tspan x="682" y="1351.6">connection&#39;s</tspan><tspan x="682" y="1375.6">workspace while</tspan><tspan x="682" y="1399.6">it is on</tspan></text>
    <rect x="808" y="1298" width="152" height="264" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="884" y="1327.6">Policies:</tspan><tspan x="884" y="1351.6">accounts,</tspan><tspan x="884" y="1375.6">memberships as</tspan><tspan x="884" y="1399.6">member, its</tspan><tspan x="884" y="1423.6">groups, no</tspan><tspan x="884" y="1447.6">administrator,</tspan><tspan x="884" y="1471.6">default channels</tspan><tspan x="884" y="1495.6">by id; no</tspan><tspan x="884" y="1519.6">workspace&#39;s</tspan><tspan x="884" y="1543.6">work</tspan></text>
    <rect x="1028.26" y="1298" width="152" height="144" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="1104.26" y="1327.6">Planned with no</tspan><tspan x="1104.26" y="1351.6">policy, or past</tspan><tspan x="1104.26" y="1375.6">them as system;</tspan><tspan x="1104.26" y="1399.6">the app&#39;s own</tspan><tspan x="1104.26" y="1423.6">rules</tspan></text>
