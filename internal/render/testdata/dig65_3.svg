    <text fill="#333333" text-anchor="middle"><tspan x="733.22" y="1632.78">security alert:</tspan><tspan x="733.22" y="1656.78">the</tspan><tspan x="733.22" y="1680.78">organisation&#39;s</tspan><tspan x="733.22" y="1704.78">administrators</tspan><tspan x="733.22" y="1728.78">and auditors,</tspan><tspan x="733.22" y="1752.78">and the</tspan><tspan x="733.22" y="1776.78">webhook</tspan></text>
    <rect x="869.39" y="1603.18" width="163.63" height="168" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="951.21" y="1632.78">integrity run:</tspan><tspan x="951.21" y="1656.78">backup.never /</tspan><tspan x="951.21" y="1680.78">backup.stale, a</tspan><tspan x="951.21" y="1704.78">baseline finding;</tspan><tspan x="951.21" y="1728.78">baseline_departed</tspan><tspan x="951.21" y="1752.78">is an alert</tspan></text>
