    <rect x="0" y="673.96" width="153.86" height="28" rx="2" fill="#e8e8e8" fill-opacity="0.85"/>
    <text fill="#333333" text-anchor="middle"><tspan x="76.93" y="693.56">held by a run of ours</tspan></text>
    <rect x="181.57" y="661.96" width="194.78" height="52" rx="2" fill="#e8e8e8" fill-opacity="0.85"/>
    <text fill="#333333" text-anchor="middle"><tspan x="278.96" y="681.56">not ours, open to others, a</tspan><tspan x="278.96" y="705.56">link, cannot be made</tspan></text>
    <rect x="485.41" y="673.96" width="47.14" height="28" rx="2" fill="#e8e8e8" fill-opacity="0.85"/>
    <text fill="#333333" text-anchor="middle"><tspan x="508.98" y="693.56">taken</tspan></text>
