    <text fill="#333333" text-anchor="middle"><tspan x="554.04" y="248.6">each step</tspan></text>
    <rect x="619.16" y="229" width="162.74" height="28" rx="2" fill="#e8e8e8" fill-opacity="0.85"/>
    <text fill="#333333" text-anchor="middle"><tspan x="700.53" y="248.6">the unit fails, however</tspan></text>
    <rect x="844.05" y="673.96" width="193.89" height="28" rx="2" fill="#e8e8e8" fill-opacity="0.85"/>
    <text fill="#333333" text-anchor="middle"><tspan x="940.99" y="693.56">once the database is back</tspan></text>
    <rect x="630.06" y="1457.96" width="206.34" height="100" rx="2" fill="#e8e8e8" fill-opacity="0.85"/>
    <text fill="#333333" text-anchor="middle"><tspan x="733.22" y="1477.56">backup_failed,</tspan><tspan x="733.22" y="1501.56">backup_restored;</tspan><tspan x="733.22" y="1525.56">backup_skipped the second</tspan><tspan x="733.22" y="1549.56">time in 36 hours</tspan></text>
    <rect x="861.39" y="1481.96" width="179.63" height="52" rx="2" fill="#e8e8e8" fill-opacity="0.85"/>
    <text fill="#333333" text-anchor="middle"><tspan x="951.21" y="1501.56">newest backup_verified,</tspan><tspan x="951.21" y="1525.56">backup_files_verified</tspan></text>
    <rect x="453.48" y="0" width="162.7" height="48" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="534.83" y="29.6">digin-backup.timer</tspan></text>
    <rect x="458.83" y="98" width="152" height="96" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="534.83" y="127.6">make backup-</tspan><tspan x="534.83" y="151.6">nightly:</tspan><tspan x="534.83" y="175.6">tools/backups.sh</tspan></text>
    <polygon points="349.92,292 517.4,459.48 349.92,626.96 182.44,459.48" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="349.92" y="405.08">lock: .locks/digin-</tspan><tspan x="349.92" y="429.08">backup.lock in the</tspan><tspan x="349.92" y="453.08">checkout, the directory</tspan><tspan x="349.92" y="477.08">mode 700; both the</tspan><tspan x="349.92" y="501.08">running account&#39;s and</tspan><tspan x="349.92" y="525.08">open to nobody else</tspan></text>
    <rect x="0.9" y="748.96" width="152.06" height="120" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="76.93" y="778.56">Skipped: nothing</tspan><tspan x="76.93" y="802.56">done,</tspan><tspan x="76.93" y="826.56">backup_skipped,</tspan><tspan x="76.93" y="850.56">exit 0</tspan></text>
    <rect x="202.96" y="748.96" width="152" height="120" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="278.96" y="778.56">refused: nothing</tspan><tspan x="278.96" y="802.56">done,</tspan><tspan x="278.96" y="826.56">backup_failed at</tspan><tspan x="278.96" y="850.56">lock, exit 1</tspan></text>
    <rect x="404.96" y="748.96" width="208.03" height="192" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="508.98" y="778.56">make backup: pg_dump</tspan><tspan x="508.98" y="802.56">in the db container,</tspan><tspan x="508.98" y="826.56">sealed by the host&#39;s</tspan><tspan x="508.98" y="850.56">openssl to</tspan><tspan x="508.98" y="874.56">DIGIN_BACKUP_CERT,</tspan><tspan x="508.98" y="898.56">into the digin-backups</tspan><tspan x="508.98" y="922.56">volume</tspan></text>
    <rect x="397.38" y="1038.96" width="223.18" height="384" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="508.98" y="1068.56">take the files: digin files</tspan><tspan x="508.98" y="1092.56">snapshot in the app&#39;s</tspan><tspan x="508.98" y="1116.56">container, unpacked</tspan><tspan x="508.98" y="1140.56">beside the dump as digin-</tspan><tspan x="508.98" y="1164.56">moment.files.part, each file</tspan><tspan x="508.98" y="1188.56">named by the hash of its</tspan><tspan x="508.98" y="1212.56">sealed bytes; what the</tspan><tspan x="508.98" y="1236.56">night before holds with the</tspan><tspan x="508.98" y="1260.56">same bytes hard-linked by</tspan><tspan x="508.98" y="1284.56">its sum, not sent; the</tspan><tspan x="508.98" y="1308.56">INDEX (snapshot name to</tspan><tspan x="508.98" y="1332.56">data-volume name) sealed</tspan><tspan x="508.98" y="1356.56">to DIGIN_BACKUP_CERT</tspan><tspan x="508.98" y="1380.56">as INDEX.cms, plain only</tspan><tspan x="508.98" y="1404.56">with no certificate</tspan></text>
    <rect x="410.73" y="1592.96" width="196.5" height="312" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="508.98" y="1622.56">verify the dump: make</tspan><tspan x="508.98" y="1646.56">backup-verify parses</tspan><tspan x="508.98" y="1670.56">the whole CMS</tspan><tspan x="508.98" y="1694.56">envelope; the</tspan><tspan x="508.98" y="1718.56">envelope names the</tspan><tspan x="508.98" y="1742.56">certificate&#39;s issuer and</tspan><tspan x="508.98" y="1766.56">serial; size at least 64</tspan><tspan x="508.98" y="1790.56">KB. With</tspan><tspan x="508.98" y="1814.56">DIGIN_BACKUP_KEY,</tspan><tspan x="508.98" y="1838.56">or a plain dump,</tspan><tspan x="508.98" y="1862.56">pg_restore reads the</tspan><tspan x="508.98" y="1886.56">contents too</tspan></text>
    <rect x="422.26" y="1954.96" width="173.44" height="312" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="508.98" y="1984.56">verify the files: the</tspan><tspan x="508.98" y="2008.56">app found every file</tspan><tspan x="508.98" y="2032.56">the database points</tspan><tspan x="508.98" y="2056.56">at and each opened</tspan><tspan x="508.98" y="2080.56">to its name;</tspan><tspan x="508.98" y="2104.56">sha256sum -c</tspan><tspan x="508.98" y="2128.56">SHA256SUMS</tspan><tspan x="508.98" y="2152.56">beside the dumps;</tspan><tspan x="508.98" y="2176.56">INDEX.cms</tspan><tspan x="508.98" y="2200.56">addressed to the</tspan><tspan x="508.98" y="2224.56">certificate; then</tspan><tspan x="508.98" y="2248.56">renamed to .files</tspan></text>
    <rect x="354.5" y="2316.96" width="308.96" height="240" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="508.98" y="2346.56">copy to DIGIN_BACKUP_COPY_TO:</tspan><tspan x="508.98" y="2370.56">the dump (SHA-256 checked) and the</tspan><tspan x="508.98" y="2394.56">snapshot (linked to the one before by</tspan><tspan x="508.98" y="2418.56">sum, read back whole, or with</tspan><tspan x="508.98" y="2442.56">DIGIN_BACKUP_COPY_CHECK=new</tspan><tspan x="508.98" y="2466.56">only what was sent and all of it weekly;</tspan><tspan x="508.98" y="2490.56">or a tar to a command); sealed only,</tspan><tspan x="508.98" y="2514.56">index sealed only; never removes a</tspan><tspan x="508.98" y="2538.56">copy</tspan></text>
    <rect x="399.62" y="2606.96" width="218.7" height="168" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="508.98" y="2636.56">prune: dumps and</tspan><tspan x="508.98" y="2660.56">snapshots older than</tspan><tspan x="508.98" y="2684.56">DIGIN_BACKUP_RETAIN</tspan><tspan x="508.98" y="2708.56">days, never the newest;</tspan><tspan x="508.98" y="2732.56">skipped when the files did</tspan><tspan x="508.98" y="2756.56">not verify</tspan></text>
    <rect x="662.99" y="748.96" width="152" height="240" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="738.99" y="778.56">digin backup</tspan><tspan x="738.99" y="802.56">record, in the</tspan><tspan x="738.99" y="826.56">app&#39;s container:</tspan><tspan x="738.99" y="850.56">backup_taken /</tspan><tspan x="738.99" y="874.56">verified /</tspan><tspan x="738.99" y="898.56">files_taken /</tspan><tspan x="738.99" y="922.56">files_verified /</tspan><tspan x="738.99" y="946.56">copied / pruned /</tspan><tspan x="738.99" y="970.56">failed / skipped</tspan></text>
    <rect x="588.04" y="292" width="224.98" height="120" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="700.53" y="321.6">OnFailure=: digin-backup-</tspan><tspan x="700.53" y="345.6">failed.service, make</tspan><tspan x="700.53" y="369.6">backup-failed:</tspan><tspan x="700.53" y="393.6">tools/backups.sh unit-failed</tspan></text>
    <rect x="864.99" y="292" width="152" height="168" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="940.99" y="321.6">make restore /</tspan><tspan x="940.99" y="345.6">make restore-</tspan><tspan x="940.99" y="369.6">files, by hand:</tspan><tspan x="940.99" y="393.6">tools/backups.sh</tspan><tspan x="940.99" y="417.6">restore, restore-</tspan><tspan x="940.99" y="441.6">files</tspan></text>
    <rect x="864.99" y="748.96" width="152" height="144" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="940.99" y="778.56">digin backup</tspan><tspan x="940.99" y="802.56">record restored /</tspan><tspan x="940.99" y="826.56">files-restored,</tspan><tspan x="940.99" y="850.56">into the log put</tspan><tspan x="940.99" y="874.56">back</tspan></text>
    <path d="M765.1,1052.68 A76,13.72 0 0 1 917.1,1052.68 L917.1,1100.68 A76,13.72 0 0 1 765.1,1100.68 Z" fill="#ECECFF" stroke="#9370DB"/><path d="M765.1,1052.68 A76,13.72 0 0 0 917.1,1052.68" fill="none" stroke="#9370DB"/>
