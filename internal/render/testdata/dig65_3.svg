    <rect x="657.22" y="1592.96" width="152" height="192" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="733.22" y="1622.56">security alert:</tspan><tspan x="733.22" y="1646.56">the</tspan><tspan x="733.22" y="1670.56">organisation&#39;s</tspan><tspan x="733.22" y="1694.56">administrators</tspan><tspan x="733.22" y="1718.56">and auditors,</tspan><tspan x="733.22" y="1742.56">and the</tspan><tspan x="733.22" y="1766.56">webhook</tspan></text>
    <rect x="869.39" y="1592.96" width="163.63" height="168" fill="#ECECFF" stroke="#9370DB"/>
    <text fill="#333333" text-anchor="middle"><tspan x="951.21" y="1622.56">integrity run:</tspan><tspan x="951.21" y="1646.56">backup.never /</tspan><tspan x="951.21" y="1670.56">backup.stale, a</tspan><tspan x="951.21" y="1694.56">baseline finding;</tspan><tspan x="951.21" y="1718.56">baseline_departed</tspan><tspan x="951.21" y="1742.56">is an alert</tspan></text>
