    <polygon points="349.72,316 540.31,506.59 349.72,697.18 159.13,506.59" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="349.72" y="404.19">lock:</tspan><tspan x="349.72" y="428.19">.locks/digin-</tspan><tspan x="349.72" y="452.19">backup.lock in</tspan><tspan x="349.72" y="476.19">the checkout,</tspan><tspan x="349.72" y="500.19">the directory</tspan><tspan x="349.72" y="524.19">mode 700; both</tspan><tspan x="349.72" y="548.19">the running</tspan><tspan x="349.72" y="572.19">account&#39;s and</tspan><tspan x="349.72" y="596.19">open to nobody</tspan><tspan x="349.72" y="620.19">else</tspan></text>
    <rect x="0.9" y="819.18" width="152.06" height="120" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="76.93" y="848.78">Skipped: nothing</tspan><tspan x="76.93" y="872.78">done,</tspan><tspan x="76.93" y="896.78">backup_skipped,</tspan><tspan x="76.93" y="920.78">exit 0</tspan></text>
    <rect x="202.96" y="819.18" width="152" height="120" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="278.96" y="848.78">refused: nothing</tspan><tspan x="278.96" y="872.78">done,</tspan><tspan x="278.96" y="896.78">backup_failed at</tspan><tspan x="278.96" y="920.78">lock, exit 1</tspan></text>
    <rect x="404.96" y="819.18" width="208.03" height="216" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="508.98" y="848.78">make backup:</tspan><tspan x="508.98" y="872.78">pg_dump in the</tspan><tspan x="508.98" y="896.78">db container,</tspan><tspan x="508.98" y="920.78">sealed by the</tspan><tspan x="508.98" y="944.78">host&#39;s openssl to</tspan><tspan x="508.98" y="968.78">DIGIN_BACKUP_CERT,</tspan><tspan x="508.98" y="992.78">into the digin-</tspan><tspan x="508.98" y="1016.78">backups volume</tspan></text>
    <rect x="397.38" y="1109.18" width="223.18" height="384" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="508.98" y="1138.78">take the files: digin files</tspan><tspan x="508.98" y="1162.78">snapshot in the app&#39;s</tspan><tspan x="508.98" y="1186.78">container, unpacked</tspan><tspan x="508.98" y="1210.78">beside the dump as digin-</tspan><tspan x="508.98" y="1234.78">moment.files.part, each file</tspan><tspan x="508.98" y="1258.78">named by the hash of its</tspan><tspan x="508.98" y="1282.78">sealed bytes; what the</tspan><tspan x="508.98" y="1306.78">night before holds with the</tspan><tspan x="508.98" y="1330.78">same bytes hard-linked by</tspan><tspan x="508.98" y="1354.78">its sum, not sent; the</tspan><tspan x="508.98" y="1378.78">INDEX (snapshot name to</tspan><tspan x="508.98" y="1402.78">data-volume name) sealed</tspan><tspan x="508.98" y="1426.78">to DIGIN_BACKUP_CERT</tspan><tspan x="508.98" y="1450.78">as INDEX.cms, plain only</tspan><tspan x="508.98" y="1474.78">with no certificate</tspan></text>
    <rect x="410.73" y="1663.18" width="196.5" height="312" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="508.98" y="1692.78">verify the dump:</tspan><tspan x="508.98" y="1716.78">make backup-verify</tspan><tspan x="508.98" y="1740.78">parses the whole</tspan><tspan x="508.98" y="1764.78">CMS envelope; the</tspan><tspan x="508.98" y="1788.78">envelope names the</tspan><tspan x="508.98" y="1812.78">certificate&#39;s issuer</tspan><tspan x="508.98" y="1836.78">and serial; size at</tspan><tspan x="508.98" y="1860.78">least 64 KB. With</tspan><tspan x="508.98" y="1884.78">DIGIN_BACKUP_KEY,</tspan><tspan x="508.98" y="1908.78">or a plain dump,</tspan><tspan x="508.98" y="1932.78">pg_restore reads the</tspan><tspan x="508.98" y="1956.78">contents too</tspan></text>
    <rect x="422.26" y="2025.18" width="173.44" height="312" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="508.98" y="2054.78">verify the files: the</tspan><tspan x="508.98" y="2078.78">app found every file</tspan><tspan x="508.98" y="2102.78">the database points</tspan><tspan x="508.98" y="2126.78">at and each opened</tspan><tspan x="508.98" y="2150.78">to its name;</tspan><tspan x="508.98" y="2174.78">sha256sum -c</tspan><tspan x="508.98" y="2198.78">SHA256SUMS</tspan><tspan x="508.98" y="2222.78">beside the dumps;</tspan><tspan x="508.98" y="2246.78">INDEX.cms</tspan><tspan x="508.98" y="2270.78">addressed to the</tspan><tspan x="508.98" y="2294.78">certificate; then</tspan><tspan x="508.98" y="2318.78">renamed to .files</tspan></text>
    <rect x="354.5" y="2387.18" width="308.96" height="336" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="508.98" y="2416.78">copy to</tspan><tspan x="508.98" y="2440.78">DIGIN_BACKUP_COPY_TO:</tspan><tspan x="508.98" y="2464.78">the dump (SHA-256</tspan><tspan x="508.98" y="2488.78">checked) and the</tspan><tspan x="508.98" y="2512.78">snapshot (linked to the</tspan><tspan x="508.98" y="2536.78">one before by sum, read</tspan><tspan x="508.98" y="2560.78">back whole, or with</tspan><tspan x="508.98" y="2584.78">DIGIN_BACKUP_COPY_CHECK=new</tspan><tspan x="508.98" y="2608.78">only what was sent and</tspan><tspan x="508.98" y="2632.78">all of it weekly; or a tar</tspan><tspan x="508.98" y="2656.78">to a command); sealed</tspan><tspan x="508.98" y="2680.78">only, index sealed only;</tspan><tspan x="508.98" y="2704.78">never removes a copy</tspan></text>
    <rect x="399.62" y="2773.18" width="218.7" height="216" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="508.98" y="2802.78">prune: dumps</tspan><tspan x="508.98" y="2826.78">and snapshots</tspan><tspan x="508.98" y="2850.78">older than</tspan><tspan x="508.98" y="2874.78">DIGIN_BACKUP_RETAIN</tspan><tspan x="508.98" y="2898.78">days, never the</tspan><tspan x="508.98" y="2922.78">newest; skipped</tspan><tspan x="508.98" y="2946.78">when the files</tspan><tspan x="508.98" y="2970.78">did not verify</tspan></text>
    <rect x="662.99" y="819.18" width="152" height="240" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="738.99" y="848.78">digin backup</tspan><tspan x="738.99" y="872.78">record, in the</tspan><tspan x="738.99" y="896.78">app&#39;s container:</tspan><tspan x="738.99" y="920.78">backup_taken /</tspan><tspan x="738.99" y="944.78">verified /</tspan><tspan x="738.99" y="968.78">files_taken /</tspan><tspan x="738.99" y="992.78">files_verified /</tspan><tspan x="738.99" y="1016.78">copied / pruned /</tspan><tspan x="738.99" y="1040.78">failed / skipped</tspan></text>
    <rect x="643.37" y="316" width="152" height="192" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="719.37" y="345.6">OnFailure=:</tspan><tspan x="719.37" y="369.6">digin-backup-</tspan><tspan x="719.37" y="393.6">failed.service,</tspan><tspan x="719.37" y="417.6">make backup-</tspan><tspan x="719.37" y="441.6">failed:</tspan><tspan x="719.37" y="465.6">tools/backups.sh</tspan><tspan x="719.37" y="489.6">unit-failed</tspan></text>
    <rect x="864.99" y="316" width="152" height="168" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="940.99" y="345.6">make restore /</tspan><tspan x="940.99" y="369.6">make restore-</tspan><tspan x="940.99" y="393.6">files, by hand:</tspan><tspan x="940.99" y="417.6">tools/backups.sh</tspan><tspan x="940.99" y="441.6">restore, restore-</tspan><tspan x="940.99" y="465.6">files</tspan></text>
    <rect x="864.99" y="819.18" width="152" height="144" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="940.99" y="848.78">digin backup</tspan><tspan x="940.99" y="872.78">record restored /</tspan><tspan x="940.99" y="896.78">files-restored,</tspan><tspan x="940.99" y="920.78">into the log put</tspan><tspan x="940.99" y="944.78">back</tspan></text>
