    <text fill="#e6e6e6" text-anchor="middle"><tspan x="76" y="1357.6">Policies:</tspan><tspan x="76" y="1381.6">member</tspan><tspan x="76" y="1405.6">workspaces,</tspan><tspan x="76" y="1429.6">their projects,</tspan><tspan x="76" y="1453.6">what is under</tspan><tspan x="76" y="1477.6">them, their own</tspan><tspan x="76" y="1501.6">conversations</tspan></text>
    <rect x="202" y="1328" width="152" height="192" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="278" y="1357.6">Policies:</tspan><tspan x="278" y="1381.6">digin_bot_reach,</tspan><tspan x="278" y="1405.6">its workspace,</tspan><tspan x="278" y="1429.6">granted projects,</tspan><tspan x="278" y="1453.6">its channels; no</tspan><tspan x="278" y="1477.6">writes where</tspan><tspan x="278" y="1501.6">read-only</tspan></text>
    <rect x="404" y="1328" width="152" height="72" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="480" y="1357.6">Policies: no row</tspan><tspan x="480" y="1381.6">of any table</tspan></text>
