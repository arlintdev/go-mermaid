    <text fill="#e6e6e6" text-anchor="middle"><tspan x="682" y="1357.6">Policies: the</tspan><tspan x="682" y="1381.6">connection&#39;s</tspan><tspan x="682" y="1405.6">workspace while</tspan><tspan x="682" y="1429.6">it is on</tspan></text>
    <rect x="808" y="1328" width="152" height="264" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="884" y="1357.6">Policies:</tspan><tspan x="884" y="1381.6">accounts,</tspan><tspan x="884" y="1405.6">memberships as</tspan><tspan x="884" y="1429.6">member, its</tspan><tspan x="884" y="1453.6">groups, no</tspan><tspan x="884" y="1477.6">administrator,</tspan><tspan x="884" y="1501.6">default channels</tspan><tspan x="884" y="1525.6">by id; no</tspan><tspan x="884" y="1549.6">workspace&#39;s</tspan><tspan x="884" y="1573.6">work</tspan></text>
