    <rect x="1010" y="942" width="188.53" height="336" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="1104.26" y="971.6">The server&#39;s own</tspan><tspan x="1104.26" y="995.6">work: on its own login</tspan><tspan x="1104.26" y="1019.6">as digin_system; on</tspan><tspan x="1104.26" y="1043.6">one login of the</tspan><tspan x="1104.26" y="1067.6">server&#39;s, the same; as</tspan><tspan x="1104.26" y="1091.6">the login itself where</tspan><tspan x="1104.26" y="1115.6">that is a superuser or</tspan><tspan x="1104.26" y="1139.6">the tables&#39; owner;</tspan><tspan x="1104.26" y="1163.6">inside somebody&#39;s</tspan><tspan x="1104.26" y="1187.6">transaction, digin_app</tspan><tspan x="1104.26" y="1211.6">vouched for as</tspan><tspan x="1104.26" y="1235.6">system. digin.actor =</tspan><tspan x="1104.26" y="1259.6">system</tspan></text>
