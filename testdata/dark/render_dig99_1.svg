    <rect x="0" y="942" width="152" height="144" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="76" y="971.6">SET role</tspan><tspan x="76" y="995.6">digin_app,</tspan><tspan x="76" y="1019.6">digin.actor =</tspan><tspan x="76" y="1043.6">user id,</tspan><tspan x="76" y="1067.6">digin.reach</tspan></text>
    <rect x="202" y="942" width="152" height="192" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="278" y="971.6">SET role</tspan><tspan x="278" y="995.6">digin_app,</tspan><tspan x="278" y="1019.6">digin.actor =</tspan><tspan x="278" y="1043.6">bot&#39;s user id,</tspan><tspan x="278" y="1067.6">digin.reach =</tspan><tspan x="278" y="1091.6">bot:B or</tspan><tspan x="278" y="1115.6">bot:B@U</tspan></text>
    <rect x="404" y="942" width="152" height="120" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="480" y="971.6">SET role</tspan><tspan x="480" y="995.6">digin_app,</tspan><tspan x="480" y="1019.6">digin.actor =</tspan><tspan x="480" y="1043.6">nobody</tspan></text>
