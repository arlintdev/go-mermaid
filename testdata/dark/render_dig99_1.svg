    <text fill="#e6e6e6" text-anchor="middle"><tspan x="682" y="971.6">SET role</tspan><tspan x="682" y="995.6">digin_app,</tspan><tspan x="682" y="1019.6">digin.actor =</tspan><tspan x="682" y="1043.6">forge,</tspan><tspan x="682" y="1067.6">digin.reach =</tspan><tspan x="682" y="1091.6">connection:C</tspan></text>
