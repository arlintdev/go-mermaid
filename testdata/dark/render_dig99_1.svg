    <rect x="438.16" y="220" width="152" height="120" fill="#2b2b40" stroke="#8888bb"/>
    <text fill="#e6e6e6" text-anchor="middle"><tspan x="514.16" y="249.6">A bot is woken:</tspan><tspan x="514.16" y="273.6">named, handed</tspan><tspan x="514.16" y="297.6">an issue, a</tspan><tspan x="514.16" y="321.6">watch, a task</tspan></text>
