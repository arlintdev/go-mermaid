    <text fill="#e6e6e6" text-anchor="middle"><tspan x="1104.26" y="1357.6">Planned with no</tspan><tspan x="1104.26" y="1381.6">policy, or past</tspan><tspan x="1104.26" y="1405.6">them as system;</tspan><tspan x="1104.26" y="1429.6">the app&#39;s own</tspan><tspan x="1104.26" y="1453.6">rules</tspan></text>
